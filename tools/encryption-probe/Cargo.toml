[package]
name = "encryption-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rusqlite = { version = "=0.32.1", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
