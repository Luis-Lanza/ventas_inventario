[package]
name = "repuestos-autos"
version = "1.4.0"
edition = "2021"
default-run = "repuestos-autos"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[[bin]]
name = "repuestos-autos"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "bootstrap-demo"
path = "src/bin/bootstrap_demo.rs"

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "test"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
printpdf = { version = "=0.12.8", default-features = false }
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
sha2 = "0.10"
argon2 = { version = "0.5.3", features = ["rand"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "=0.10.4"
iana-time-zone = "=0.1.65"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
license-protocol = { path = "../crates/license-protocol" }
ed25519-dalek = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_System_WindowsProgramming"] }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
base64 = "0.22"
